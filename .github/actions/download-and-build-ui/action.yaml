name: Download and Build UI
description: Downloads, builds, and copies temporalio/ui from a given SHA

inputs:
  ref:
    description: 'Commit SHA of temporalio/ui to build'
    required: true
  token:
    description: 'GitHub token for authentication'
    required: true
  upstream_org:
    description: 'Upstream organization of the UI repository'
    required: true
  upstream_repo:
    description: 'Upstream repository of the UI'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download UI
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      with:
        repository: ${{ inputs.upstream_org }}/${{ inputs.upstream_repo }}
        ref: ${{ inputs.ref }}
        path: ui-release

    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-node

    - name: Install dependencies and build UI
      shell: bash
      env:
        HUSKY: '0'
      run: |
        cd ui-release
        pnpm install
        pnpm build:server

    - name: Copy UI to server
      shell: bash
      run: |
        # Mirror ui/server into this repo. --delete removes files that were
        # deleted or renamed in temporalio/ui. The excludes are files that
        # only ui-server has.
        test -f ui-release/server/go.mod
        changes="$RUNNER_TEMP/sync-changes.txt"
        rsync --archive --delete --itemize-changes \
          --exclude=/.git/ \
          --exclude=/.github/ \
          --exclude=/.vscode/ \
          --exclude=/.gitignore \
          --exclude=/.goreleaser.yml \
          --exclude=/ui-release/ \
          ui-release/server/ ./ > "$changes"
        rm -rf ui-release

        deleted=$(grep '^\*deleting' "$changes" | grep -v ' ui/assets/local/' | sed 's/^\*deleting *//' || true)
        if [ -n "$deleted" ]; then
          {
            echo "### Files deleted by the sync"
            echo
            echo "$deleted" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
